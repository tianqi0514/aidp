services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aidp
      POSTGRES_USER: aidp
      POSTGRES_PASSWORD: aidp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidp -d aidp"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - aidp-postgres:/var/lib/postgresql/data

  server:
    build: ./apps/server
    environment:
      AIDP_ENV: development
      AIDP_DATABASE_URL: postgresql+psycopg://aidp:aidp@postgres:5432/aidp
      AIDP_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      AIDP_SECRET_KEY: local-compose-only
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8080:80"

volumes:
  aidp-postgres:
