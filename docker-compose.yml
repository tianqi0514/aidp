services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidp
      POSTGRES_USER: aidp
      POSTGRES_PASSWORD: ${AIDP_POSTGRES_PASSWORD:-aidp}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidp -d aidp"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${AIDP_POSTGRES_BIND:-127.0.0.1}:${AIDP_POSTGRES_PORT:-15432}:5432"
    volumes:
      - aidp-postgres:/var/lib/postgresql/data

  server:
    restart: unless-stopped
    build:
      context: ./apps/server
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
    environment:
      AIDP_ENV: ${AIDP_ENV:-production}
      AIDP_DATABASE_URL: postgresql+psycopg://aidp:${AIDP_POSTGRES_PASSWORD:-aidp}@postgres:5432/aidp
      AIDP_CORS_ORIGINS: ${AIDP_CORS_ORIGINS:-http://localhost:5173,http://localhost:9004}
      AIDP_SECRET_KEY: ${AIDP_SECRET_KEY:-local-compose-only}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${AIDP_SERVER_BIND:-127.0.0.1}:${AIDP_SERVER_PORT:-18000}:8000"

  web:
    restart: unless-stopped
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${AIDP_WEB_BIND:-0.0.0.0}:${AIDP_WEB_PORT:-9004}:80"

volumes:
  aidp-postgres:
