[project]
name = "aidp-server"
version = "0.1.0"
description = "AIDP modular backend and agent capability runtime"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<46",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "jsonschema>=4.25,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aidp"]
